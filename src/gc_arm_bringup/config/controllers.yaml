controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — bustest 결과에 따라 조정 (6축 x 100 Hz ≈ 버스 부하 20~30%)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    # position + velocity: 하드웨어가 속도 명령으로 모터 속도 제한(AK 위치-속도, MKS 0xF5 rpm)을 계산
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
