# GC 6축 로봇팔 관절/하드웨어 설정 — URDF(xacro)와 ros2_control 하드웨어 파라미터의 단일 출처
#
# enabled: true  → 실제 모터 구동 (type에 따라 ak_servo | mks)
# enabled: false → mock (하드웨어 없이 명령을 그대로 상태로 반영)
# ⚠️ 기본값은 전부 false(안전). 실제로 버스에 연결한 관절만 true로 바꿀 것.
#
# 관절 좌표 정의: q_joint = direction × θ_actuator / ratio + offset
#   θ_actuator: AK = 액추에이터 출력축 각도, MKS = 모터축 각도
#
# TODO(실측/확인): 각 관절 direction/offset/가동범위, AK 극쌍수  (geometry r/h는 CAD로 확정)

# AK 드라이버 설정 확인 결과 (AK Config UI V3.2.0, J2/J3 AK45-36, J5 AK45-10 공통):
#   CAN 1Mbps, Periodic Feedback 200 Hz, timeout 1000 ms (송신 중단 1 s 후 전류 0 A — 위치 유지/토크 해제 부하 시험 필요),
#   위치 피드백/명령 = 출력축(내장 감속 후) deg 확인 (90° 명령 → 링크 약 35° = 90/2.57),
#   Bus voltage 12~28 V(회생 여유 4 V 주의), 온도 제한 85 °C (코드 max_temperature 80 °C)
#   CAN 피드백 위치는 동작 중 다회전 연속값(실측: -345° → +253° 끊김 없음), GUI 표시만 0~360°.
#   ERPM 환산 실측 일치(3000 ERPM → 출력 약 128°/s, 극쌍수 14). 전원 재투입 시 다회전 정보 소실
#   (출력축 한 바퀴 내 위치만 유지) → AK 관절은 startup_reference_deg 필수:
#   전원을 켤 때 관절이 놓여 있는 자세. 실제 자세가 기준에서 ±180°/ratio 이내여야 함
#   (J2 ±45°, J3 ±90°, J5 ±70°). 범위 밖이면 관절 위치를 360°/ratio 단위로 잘못 인식함.
#   운용 규칙: 종료 전 시작/종료 자세로 이동 → 전원 차단, 전원 투입도 그 자세에서.
#   현재 값은 ready 기준 임시값 — ready와 비슷한 안정 자세(park)로 확정 예정 (허용 범위 안이면 그대로 동작)

hardware:
  can_interface: can0          # 'sim' = 시뮬레이션 버스 (실제 프로토콜 경로를 하드웨어 없이 시험)
  activate_timeout_ms: 1000

geometry:                      # Standard DH [m]
  r: 0.0                       # a1 — CAD 확인: J2 축이 J1 축과 교차
  h: 0.082                     # d1 — CAD: 베이스 바닥면 ~ J2 축 82.0 mm
  a2: 0.245
  d4: 0.245
  d6: 0.059

joints:
  joint1:                      # 베이스 회전 — SERVO57D 직결
    enabled: false
    type: mks
    can_id: 1
    ratio: 1.0
    direction: 1
    offset_deg: 0.0
    lower_deg: -170.0
    upper_deg: 170.0
    max_velocity_deg_s: 60.0
    effort_nm: 2.0
    mks_max_rpm: 600
    mks_acc: 0

  joint2:                      # 어깨 — AK45-36 + 외부 4:1
    enabled: false
    type: ak_servo
    can_id: 101
    ratio: 4.0
    direction: 1               # 확인: 모터 + = 팔 수평에서 상완 상승 = URDF +q2
    offset_deg: 0.0            # TODO 조립 후 상완 수평(q2=0)일 때 모터 Angle A → offset_deg = -direction × A / ratio
    lower_deg: -120.0
    upper_deg: 120.0
    max_velocity_deg_s: 60.0
    effort_nm: 40.0
    ak_pole_pairs: 14          # 확인 (AK Config UI)
    ak_internal_ratio: 36      # 확인 (Gear Param Ratio 36), Multi Mode, ID 101 / 1Mbps / Fdb 200 Hz
    startup_reference_deg: 90.0    # 임시: ready 기준. 최종 시작/종료(park) 자세 확정 시 갱신
    ak_accel: 30000            # ERPM/s
    ak_torque_constant: 0.0    # 출력축 Nm/A, 0 = 미설정

  joint3:                      # 팔꿈치 — AK45-36 + 외부 2:1
    enabled: false
    type: ak_servo
    can_id: 102
    ratio: 2.0
    direction: 1               # 확인: 모터 + = 상완 수직·전완 수평에서 전완 상승 = URDF +q3
    offset_deg: 0.0            # TODO 조립 후 전완-상완 일직선일 때 모터 Angle A → offset_deg = -direction × A / ratio
    lower_deg: -135.0
    upper_deg: 135.0
    max_velocity_deg_s: 60.0
    effort_nm: 20.0
    ak_pole_pairs: 14          # 확인 (AK Config UI)
    ak_internal_ratio: 36      # 확인 (Gear Param Ratio 36), Multi Mode, ID 102 / 1Mbps / Fdb 200 Hz
    startup_reference_deg: -90.0   # 임시: ready 기준. 최종 시작/종료(park) 자세 확정 시 갱신
    ak_accel: 30000
    ak_torque_constant: 0.0

  joint4:                      # 전완 회전 — SERVO42D + 20:1 (자체 제작)
    enabled: false
    type: mks
    can_id: 2
    ratio: 20.0
    direction: 1
    offset_deg: 0.0
    lower_deg: -180.0
    upper_deg: 180.0
    max_velocity_deg_s: 90.0   # 모터 300 rpm
    effort_nm: 5.0
    mks_max_rpm: 600
    mks_acc: 0

  joint5:                      # 손목 굽힘 — AK45-10 + 외부 18/7
    enabled: false
    type: ak_servo
    can_id: 103
    ratio: 2.5714285714285716  # 18/7
    direction: 1               # 확인: 모터 각도 + = 전완 수평 시 link5 상승 = URDF +q5 (조립 후 RViz 대조)
    offset_deg: 0.0            # TODO 조립 후 일직선일 때 모터 Angle A 측정 → offset_deg = -direction × A / ratio
    lower_deg: -120.0
    upper_deg: 120.0
    max_velocity_deg_s: 90.0
    effort_nm: 5.0
    ak_pole_pairs: 14          # 확인 (AK Config UI)
    ak_internal_ratio: 10      # 확인 (Gear Param Ratio 10)
    startup_reference_deg: -90.0   # 임시: ready 기준. 최종 시작/종료(park) 자세 확정 시 갱신
    ak_accel: 30000
    ak_torque_constant: 0.0

  joint6:                      # 플랜지 회전 — SERVO42D 직결
    enabled: false
    type: mks
    can_id: 3
    ratio: 1.0
    direction: 1
    offset_deg: 0.0
    lower_deg: -180.0
    upper_deg: 180.0
    max_velocity_deg_s: 120.0
    effort_nm: 0.4
    mks_max_rpm: 600
    mks_acc: 0
